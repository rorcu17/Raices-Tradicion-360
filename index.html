<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raíces y Tradición 360</title>
<meta name="description" content="Vitrina digital de artesanía local, cultura y emprendimiento estudiantil.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --verde:#0e493f;
  --verde2:#173f38;
  --crema:#fff9ef;
  --arena:#efe1c8;
  --coral:#c9614c;
  --oro:#d5aa54;
  --texto:#202824;
  --muted:#6a746e;
  --line:#e3d8c8;
  --white:#ffffff;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fffdf8;color:var(--texto)}
a{color:inherit;text-decoration:none}
.topbar{background:var(--verde2);color:#fff;text-align:center;padding:8px 15px;font-size:13px}
header{position:sticky;top:0;z-index:50;background:rgba(255,253,248,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{max-width:1200px;margin:auto;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--verde),#1d6b59);color:white;font:700 24px Georgia;border:3px solid #e7c675}
.brand small{display:block;color:var(--muted);margin-top:2px}
.links{display:flex;gap:18px;align-items:center;font-weight:700;font-size:14px}
.links .cta{background:var(--verde);color:white;padding:11px 16px;border-radius:999px}
.hero{min-height:640px;display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center;padding:70px max(20px,calc((100vw - 1200px)/2));background:linear-gradient(135deg,#fffdf8,#f3e4cd)}
.eyebrow{text-transform:uppercase;letter-spacing:.13em;color:var(--coral);font-weight:800;font-size:12px}
.hero h1{font:700 64px/1.03 Georgia,serif;margin:15px 0 20px}
.hero h1 em{color:var(--coral);font-style:normal}
.hero p{font-size:19px;line-height:1.65;color:#5a645f;max-width:720px}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}
.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:800;cursor:pointer;display:inline-block}
.primary{background:var(--verde);color:white}
.secondary{border:2px solid var(--verde);color:var(--verde);background:transparent}
.hero-art{position:relative;min-height:430px;border-radius:36px;background:linear-gradient(145deg,#f2ce77,#c65f49 55%,#0f4a40);overflow:hidden;box-shadow:0 30px 70px #0f4b4025}
.sun{position:absolute;right:58px;top:50px;width:130px;height:130px;border-radius:50%;background:#ffe8a4}
.art{position:absolute;border:2px solid #ffffff80;display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 15px 35px #0002}
.a1{left:40px;top:72px;width:155px;height:190px;background:#c8614b;transform:rotate(-7deg)}
.a2{right:48px;bottom:55px;width:170px;height:210px;background:#0f4b40;transform:rotate(7deg)}
.a3{left:122px;bottom:35px;width:145px;height:115px;background:#d6a74a;color:#543c1d}
.note{position:absolute;right:28px;top:222px;background:white;padding:16px 18px;border-radius:14px;box-shadow:0 10px 30px #0002}
.section{max-width:1200px;margin:auto;padding:80px 20px}
.heading{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:28px}
.heading h2{font:700 42px Georgia,serif;margin:8px 0}
.heading p{max-width:560px;color:var(--muted);line-height:1.6}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.filters button{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:999px;cursor:pointer}
.filters button.active{background:var(--verde);color:white}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.product{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 28px #00000010;transition:.2s}
.product:hover{transform:translateY(-4px);box-shadow:0 18px 35px #00000016}
.product img{width:100%;height:240px;object-fit:cover;background:#eee}
.product-body{padding:18px}
.code{font-size:12px;color:var(--muted)}
.product h3{font:700 25px Georgia,serif;margin:8px 0}
.price{font-size:21px;font-weight:900;color:var(--verde)}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.badge{background:#f3eee5;border-radius:999px;padding:6px 9px;font-size:12px}
.desc{color:#5f6863;line-height:1.55}
.empty{grid-column:1/-1;text-align:center;padding:45px;background:#faf6ef;border-radius:18px;color:var(--muted)}
.impact{background:var(--verde);color:white}
.impact-inner{max-width:1200px;margin:auto;padding:75px 20px}
.impact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.impact-card{background:#ffffff10;border:1px solid #ffffff28;border-radius:18px;padding:22px}
.story{display:grid;grid-template-columns:.85fr 1.15fr;gap:45px;align-items:center}
.story-art{min-height:330px;border-radius:28px;background:linear-gradient(145deg,var(--oro),var(--coral));display:grid;place-items:center;color:white;font:700 100px Georgia}
.story-copy p{line-height:1.7;color:#59635e}
.steps{display:grid;gap:12px;margin-top:18px}
.step{display:flex;gap:12px;align-items:center}
.step b{width:32px;height:32px;border-radius:50%;background:var(--verde);color:white;display:grid;place-items:center}
.contact{background:#f5eee2}
.contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.contact-card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px}
footer{background:#102f29;color:white;padding:30px 20px}
.footer-inner{max-width:1200px;margin:auto;display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}
.admin-link{opacity:.7;font-size:13px}
@media(max-width:980px){.links{display:none}.hero{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,1fr)}.story{grid-template-columns:1fr}}
@media(max-width:650px){.hero h1{font-size:42px}.products{grid-template-columns:1fr}.impact-grid,.contact-grid{grid-template-columns:1fr}.heading{align-items:start;flex-direction:column}}
</style>
</head>
<body>
<div class="topbar">● Catálogo conectado · Raíces y Tradición 360</div>

<header>
  <div class="nav">
    <a class="brand" href="#inicio">
      <span class="logo">R</span>
      <span><strong>Raíces & Tradición</strong><small>360 · Artesanía con propósito</small></span>
