<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restablecer contraseña | Raíces y Tradición 360</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#0e493f;--cream:#f7f1e7;--line:#ded8cd;--muted:#6e746f}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:#202925}
header{background:var(--green);color:#fff;padding:20px 5vw}
.wrap{max-width:520px;margin:70px auto;padding:0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 15px 35px #00000010}
h1{margin-top:0}
label{display:block;font-weight:700;margin:14px 0}
input{width:100%;padding:12px;border:1px solid #d8d1c7;border-radius:10px;margin-top:6px;font:inherit}
button{cursor:pointer;background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700}
.notice{display:none;padding:12px 14px;border-radius:10px;margin:14px 0;background:#edf6f2;color:var(--green)}
.error{background:#fdeaea;color:#8b2020}
.muted{color:var(--muted);line-height:1.5}
a{color:var(--green);font-weight:700}
</style>
</head>
<body>
<header>
  <strong style="font-size:23px">Raíces y Tradición 360</strong><br>
  <small>Restablecer contraseña</small>
</header>

<div class="wrap">
  <div class="card">
    <h1>Nueva contraseña</h1>
    <p class="muted">Escribe una nueva contraseña para tu acceso de administrador.</p>

    <div id="msg" class="notice"></div>

    <form id="resetForm">
      <label>Nueva contraseña
        <input id="password1" type="password" minlength="8" required>
      </label>

      <label>Confirmar contraseña
        <input id="password2" type="password" minlength="8" required>
      </label>

      <button type="submit">Guardar nueva contraseña</button>
    </form>

    <p id="doneLink" style="display:none;margin-top:18px">
      <a href="admin.html">Ir al panel de administración →</a>
    </p>
  </div>
</div>

<script>
const sb = window.supabase.createClient("https://gjmiiqdadsslgjszgswe.supabase.co", "sb_publishable_LQFknnAXuHgVpv9rcHVw6Q_sYc6SdPR");

function show(text, error=false){
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'notice' + (error ? ' error' : '');
  el.style.display = 'block';
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const p1 = document.getElementById('password1').value;
  const p2 = document.getElementById('password2').value;

  if (p1 !== p2) {
    show('Las contraseñas no coinciden.', true);
    return;
  }

  if (p1.length < 8) {
    show('La contraseña debe tener al menos 8 caracteres.', true);
    return;
  }

  const { error } = await sb.auth.updateUser({ password: p1 });

  if (error) {
    show('No se pudo cambiar la contraseña: ' + error.message, true);
    return;
  }

  show('Contraseña actualizada correctamente.');
  document.getElementById('resetForm').style.display = 'none';
  document.getElementById('doneLink').style.display = 'block';
});

setTimeout(async () => {
  const { data } = await sb.auth.getSession();
  if (!data.session) {
    show('Abre esta página desde el enlace de recuperación enviado por Supabase.', true);
  }
}, 1200);
</script>
</body>
</html>
