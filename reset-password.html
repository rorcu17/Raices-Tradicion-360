<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nueva contraseña | Raíces y Tradición 360</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f7f1e7;color:#1f2724}
header{background:#0e493f;color:white;padding:22px 5vw}
main{max-width:480px;margin:60px auto;padding:0 18px}
.card{background:white;border:1px solid #ded8cd;border-radius:18px;padding:24px;box-shadow:0 12px 30px #0001}
label{display:block;font-weight:700;margin:14px 0}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:10px;margin-top:6px;font-size:16px}
button{padding:12px 16px;border:0;border-radius:10px;background:#0e493f;color:white;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.msg{display:none;margin:15px 0;padding:12px;border-radius:10px;background:#edf6f2;color:#0e493f}
.err{background:#fdeaea;color:#8b2020}
</style>
</head>
<body>

<header>
<strong style="font-size:24px">Raíces y Tradición 360</strong><br>
<small>Restablecer contraseña</small>
</header>

<main>
<div class="card">
<h1>Nueva contraseña</h1>

<div id="msg" class="msg"></div>

<label>Nueva contraseña
<input id="p1" type="password" minlength="8" autocomplete="new-password">
</label>

<label>Confirmar contraseña
<input id="p2" type="password" minlength="8" autocomplete="new-password">
</label>

<button id="guardarBtn" type="button" onclick="guardar()" disabled>
Guardar contraseña
</button>
</div>
</main>

<script>
const SUPABASE_URL = 'https://gjmiiqdadsslgjszgswe.supabase.co';
const API_KEY = 'sb_publishable_LQFknnAXuHgVpv9rcHVw6Q_sYc6SdPR';

let token = '';

function mensaje(texto, error=false) {
  const m = document.getElementById('msg');
  m.textContent = texto;
  m.className = 'msg' + (error ? ' err' : '');
  m.style.display = 'block';
}

function habilitarBoton() {
  document.getElementById('guardarBtn').disabled = false;
}

async function prepararSesion() {
  const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const accessToken = hash.get('access_token');

  if (accessToken) {
    token = accessToken;
    mensaje('Enlace verificado. Escribe tu nueva contraseña.');
    habilitarBoton();
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const accessTokenQuery = params.get('access_token');

  if (accessTokenQuery) {
    token = accessTokenQuery;
    mensaje('Enlace verificado. Escribe tu nueva contraseña.');
    habilitarBoton();
    return;
  }

  mensaje(
    'Este enlace no contiene una sesión de recuperación válida. Solicita un correo nuevo de recuperación.',
    true
  );
}

async function guardar() {
  const p1 = document.getElementById('p1').value;
  const p2 = document.getElementById('p2').value;
  const btn = document.getElementById('guardarBtn');

  if (!token) {
    mensaje('Primero abre esta página desde el enlace del correo de recuperación.', true);
    return;
  }

  if (p1.length < 8) {
    mensaje('Usa una contraseña de al menos 8 caracteres.', true);
    return;
  }

  if (p1 !== p2) {
    mensaje('Las contraseñas no coinciden.', true);
    return;
  }

  btn.disabled = true;
  mensaje('Guardando nueva contraseña...');

  try {
    const r = await fetch(SUPABASE_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'apikey': API_KEY,
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({ password: p1 })
    });

    let data = {};
    try {
      data = await r.json();
    } catch(e) {}

    if (!r.ok) {
      btn.disabled = false;
      mensaje(
        'No se pudo cambiar la contraseña: ' +
        (data.msg || data.message || data.error_description || ('Error ' + r.status)),
        true
      );
      return;
    }

    mensaje('Contraseña actualizada correctamente. Ya puedes entrar al panel de administración.');

    setTimeout(() => {
      window.location.href = 'admin.html';
    }, 2500);

  } catch(e) {
    btn.disabled = false;
    mensaje('Error de conexión: ' + e.message, true);
  }
}

prepararSesion();
</script>

</body>
</html>
