<script>

const API_KEY = 'sb_publishable_LQFknnAXuHgVpv9rcHVw6Q_sYc6SdPR';
let token = '';

function mensaje(texto,error=false) {
  const m=document.getElementById('msg');
  m.textContent=texto;
  m.className='msg'+(error?' err':'');
  m.style.display='block';
}

async function prepararSesion() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');

  if (code) {
    try {
      const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=pkce', {
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':API_KEY},
        body:JSON.stringify({auth_code:code})
      });
      const data=await r.json();
      if (r.ok && data.access_token) {
        token=data.access_token;
        mensaje('Enlace verificado. Escribe tu nueva contraseña.');
        return;
      }
    } catch(e) {}
  }

  const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  if (hash.get('access_token')) {
    token = hash.get('access_token');
    mensaje('Enlace verificado. Escribe tu nueva contraseña.');
    return;
  }

  mensaje('Este enlace no contiene una sesión de recuperación válida. Solicita un correo nuevo desde admin.html.', true);
}
