<script>
const SUPABASE_URL = 'https://gjmiiqdadsslgjszgswe.supabase.co';
const API_KEY = 'sb_publishable_LQFknnAXuHgVpv9rcHVw6Q_sYc6SdPR';
const RESET_URL = 'https://rorcu17.github.io/Raices-Tradicion-360/reset-password.html';

function mensaje(texto, error=false) {
  const m = document.getElementById('msg');
  m.textContent = texto;
  m.className = 'msg' + (error ? ' err' : '');
  m.style.display = 'block';
}

async function recuperarClave() {
  const email = document.getElementById('email').value.trim();

  if (!email) {
    mensaje('Escribe primero tu correo electrónico.', true);
    return;
  }

  mensaje('Enviando correo de recuperación...');

  try {
    const url = SUPABASE_URL + '/auth/v1/recover?redirect_to=' + encodeURIComponent(RESET_URL);
    const r = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': API_KEY
      },
      body: JSON.stringify({email: email})
    });

    let data = {};
    try { data = await r.json(); } catch(e) {}

    if (!r.ok) {
      mensaje('No se pudo enviar: ' + (data.msg || data.message || ('Error ' + r.status)), true);
      return;
    }

    mensaje('Correo enviado. Abre únicamente el mensaje más reciente.');
  } catch(e) {
    mensaje('Error de conexión: ' + e.message, true);
  }
}
