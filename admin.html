<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administración | Raíces y Tradición 360</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#0e453c;--cream:#f7f1e7;--ink:#1f2724;--muted:#6e746f;--line:#ded8cd}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:var(--ink)}
header{background:var(--green);color:#fff;padding:18px 5vw;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
header h1{margin:0;font-size:24px}header small{opacity:.85}.wrap{max-width:1200px;margin:28px auto;padding:0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 12px 30px #0000000d}
#loginView{max-width:460px;margin:70px auto}label{display:block;font-weight:700;margin:12px 0}
input,select,textarea{width:100%;padding:12px;border:1px solid #d9d2c8;border-radius:10px;margin-top:6px;font:inherit;background:#fff}
button{cursor:pointer}.primary{background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700}
.secondary{background:#fff;color:var(--green);border:1px solid var(--green);border-radius:10px;padding:10px 15px;font-weight:700}
.danger{background:#8e2f2f;color:#fff;border:0;border-radius:9px;padding:9px 12px}.hidden{display:none!important}
.grid{display:grid;grid-template-columns:380px 1fr;gap:22px;align-items:start}.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.topbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.products{display:grid;gap:14px}.product{display:grid;grid-template-columns:110px 1fr auto;gap:15px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px}
.product img{width:110px;height:95px;object-fit:cover;border-radius:10px;background:#eee}.product h3{margin:0 0 6px}
.muted{color:var(--muted);font-size:13px}.price{font-weight:800;color:var(--green);font-size:18px}.row-actions{display:flex;gap:8px;flex-direction:column}
.notice{padding:11px 13px;border-radius:10px;margin:12px 0;background:#edf6f2;color:var(--green);display:none}.error{background:#fdeaea;color:#8b2020}
.preview{margin-top:10px;max-width:100%;max-height:210px;border-radius:12px;display:none}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#f0eadf;font-size:12px;margin-right:5px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}@media(max-width:620px){.product{grid-template-columns:85px 1fr}.product img{width:85px;height:78px}.row-actions{grid-column:1/-1;flex-direction:row}}
</style>
</head>
<body>
<header>
  <div><h1>Raíces y Tradición 360</h1><small>Panel de administración</small></div>
  <button id="logoutBtn" class="secondary hidden">Cerrar sesión</button>
</header>

<div class="wrap">
  <section id="loginView" class="card">
    <h2>Acceso de administrador</h2>
    <p class="muted">Ingresa con el usuario creado en Supabase Authentication.</p>
    <div id="loginMsg" class="notice"></div>
    <form id="loginForm">
      <label>Correo electrónico<input id="email" type="email" required autocomplete="username"></label>
      <label>Contraseña<input id="password" type="password" required autocomplete="current-password"></label>
      <button class="primary" type="submit">Entrar</button>
    </form>
  </section>

  <section id="adminView" class="hidden">
    <div class="topbar">
      <div><h2 style="margin-bottom:5px">Administrar catálogo</h2><div id="userEmail" class="muted"></div></div>
      <button id="newBtn" class="primary">+ Nuevo producto</button>
    </div>

    <div class="grid">
      <div class="card">
        <h3 id="formTitle">Nuevo producto</h3>
        <div id="formMsg" class="notice"></div>
        <form id="productForm">
          <input id="productId" type="hidden">
          <label>Código<input id="codigo" placeholder="Ej.: R360-CHQ-004" required></label>
          <label>Nombre<input id="nombre" placeholder="Nombre del producto" required></label>
          <label>Categoría
            <select id="categoria">
              <option>Accesorios</option><option>Textiles</option><option>Chaquiras</option><option>Naguas</option><option>Camisas</option><option>Otros</option>
            </select>
          </label>
          <label>Descripción<textarea id="descripcion" rows="4" placeholder="Descripción del producto"></textarea></label>
          <label>Precio (B/.)<input id="precio" type="number" step="0.01" min="0" placeholder="0.00"></label>
          <label>Disponibilidad
            <select id="disponibilidad">
              <option>Disponible</option><option>Disponible / personalizable</option><option>Producción limitada</option><option>Bajo pedido</option><option>Por talla y encargo</option><option>Agotado</option>
            </select>
          </label>
          <label>Foto del producto<input id="foto" type="file" accept="image/*"></label>
          <img id="preview" class="preview" alt="Vista previa">
          <label style="display:flex;align-items:center;gap:8px;font-weight:700"><input id="activo" type="checkbox" checked style="width:auto;margin:0">Mostrar producto en el catálogo</label>
          <div class="form-actions">
            <button class="primary" type="submit">Guardar producto</button>
            <button id="cancelEditBtn" class="secondary" type="button">Limpiar</button>
          </div>
        </form>
      </div>

      <div class="card">
        <div class="topbar"><h3 style="margin:0">Productos</h3><button id="refreshBtn" class="secondary">Actualizar lista</button></div>
        <div id="listMsg" class="notice"></div>
        <div id="productList" class="products"></div>
      </div>
    </div>
  </section>
</div>

<script>
const SUPABASE_URL = "https://gjmiiqdadsslgjszgswe.supabase.co";
const SUPABASE_KEY = "sb_publishable_LQFknnAXuHgVpv9rcHVw6Q_sYc6SdPR";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const loginView = document.getElementById('loginView');
const adminView = document.getElementById('adminView');
const logoutBtn = document.getElementById('logoutBtn');

function showMsg(id, text, isError=false){
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'notice' + (isError ? ' error' : '');
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 5000);
}

async function checkSession(){
  const { data } = await sb.auth.getSession();
  const session = data.session;
  if(session){
    loginView.classList.add('hidden');
    adminView.classList.remove('hidden');
    logoutBtn.classList.remove('hidden');
    document.getElementById('userEmail').textContent = 'Sesión: ' + (session.user.email || '');
    await loadProducts();
  } else {
    loginView.classList.remove('hidden');
    adminView.classList.add('hidden');
    logoutBtn.classList.add('hidden');
  }
}

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error) return showMsg('loginMsg', 'No se pudo iniciar sesión: ' + error.message, true);
  await checkSession();
});

logoutBtn.addEventListener('click', async ()=>{ await sb.auth.signOut(); await checkSession(); });

function clearForm(){
  document.getElementById('productForm').reset();
  document.getElementById('productId').value = '';
  document.getElementById('activo').checked = true;
  document.getElementById('preview').style.display = 'none';
  document.getElementById('preview').src = '';
  document.getElementById('formTitle').textContent = 'Nuevo producto';
}

document.getElementById('newBtn').addEventListener('click', clearForm);
document.getElementById('cancelEditBtn').addEventListener('click', clearForm);
document.getElementById('refreshBtn').addEventListener('click', loadProducts);

document.getElementById('foto').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const p = document.getElementById('preview');
  p.src = URL.createObjectURL(file);
  p.style.display = 'block';
});

async function uploadImage(file, codigo){
  if(!file) return null;
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const safeCode = (codigo || 'producto').replace(/[^a-z0-9_-]/gi,'_');
  const path = safeCode + '_' + Date.now() + '.' + ext;
  const { error: uploadError } = await sb.storage.from('productos').upload(path, file, { cacheControl:'3600', upsert:false });
  if(uploadError) throw uploadError;
  const { data } = sb.storage.from('productos').getPublicUrl(path);
  return data.publicUrl;
}

document.getElementById('productForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const id = document.getElementById('productId').value;
  const codigo = document.getElementById('codigo').value.trim();
  const file = document.getElementById('foto').files[0];

  try{
    let imageUrl = null;
    if(file) imageUrl = await uploadImage(file, codigo);

    const payload = {
      codigo,
      nombre: document.getElementById('nombre').value.trim(),
      categoria: document.getElementById('categoria').value,
      descripcion: document.getElementById('descripcion').value.trim(),
      precio: document.getElementById('precio').value === '' ? null : Number(document.getElementById('precio').value),
      disponibilidad: document.getElementById('disponibilidad').value,
      activo: document.getElementById('activo').checked
    };
    if(imageUrl) payload.imagen_url = imageUrl;

    const result = id
      ? await sb.from('productos').update(payload).eq('id', id)
      : await sb.from('productos').insert(payload);

    if(result.error) throw result.error;
    showMsg('formMsg', id ? 'Producto actualizado correctamente.' : 'Producto agregado correctamente.');
    clearForm();
    await loadProducts();
  }catch(err){
    showMsg('formMsg', 'Error: ' + (err.message || err), true);
  }
});

async function loadProducts(){
  const list = document.getElementById('productList');
  list.innerHTML = '<p class="muted">Cargando productos...</p>';

  const { data, error } = await sb.from('productos').select('*').order('id', { ascending:false });
  if(error){
    list.innerHTML = '';
    return showMsg('listMsg', 'No se pudieron cargar los productos: ' + error.message, true);
  }
  if(!data || data.length === 0){
    list.innerHTML = '<p class="muted">Todavía no hay productos.</p>';
    return;
  }

  list.innerHTML = '';
  data.forEach(p=>{
    const row = document.createElement('article');
    row.className = 'product';

    const imgHtml = p.imagen_url
      ? '<img src="'+escapeHtml(p.imagen_url)+'" alt="'+escapeHtml(p.nombre || 'Producto')+'">'
      : '<div style="width:110px;height:95px;border-radius:10px;background:#eee;display:grid;place-items:center">Sin foto</div>';

    row.innerHTML = imgHtml +
      '<div>'+
        '<div class="muted">'+escapeHtml(p.codigo || '')+'</div>'+
        '<h3>'+escapeHtml(p.nombre || '')+'</h3>'+
        '<div><span class="badge">'+escapeHtml(p.categoria || '')+'</span><span class="badge">'+escapeHtml(p.disponibilidad || '')+'</span></div>'+
        '<p class="muted">'+escapeHtml(p.descripcion || '')+'</p>'+
        '<div class="price">'+(p.precio == null ? 'Sin precio' : 'B/. ' + Number(p.precio).toFixed(2))+'</div>'+
        '<div class="muted">'+(p.activo ? 'Visible en catálogo' : 'Oculto')+'</div>'+
      '</div>'+
      '<div class="row-actions">'+
        '<button class="secondary editBtn">Editar</button>'+
        '<button class="danger deleteBtn">Borrar</button>'+
      '</div>';

    row.querySelector('.editBtn').addEventListener('click', ()=>editProduct(p));
    row.querySelector('.deleteBtn').addEventListener('click', ()=>deleteProduct(p.id, p.imagen_url || ''));
    list.appendChild(row);
  });
}

function editProduct(p){
  document.getElementById('productId').value = p.id ?? '';
  document.getElementById('codigo').value = p.codigo ?? '';
  document.getElementById('nombre').value = p.nombre ?? '';
  document.getElementById('categoria').value = p.categoria ?? 'Otros';
  document.getElementById('descripcion').value = p.descripcion ?? '';
  document.getElementById('precio').value = p.precio ?? '';
  document.getElementById('disponibilidad').value = p.disponibilidad ?? 'Disponible';
  document.getElementById('activo').checked = p.activo !== false;
  document.getElementById('formTitle').textContent = 'Editar producto';

  const prev = document.getElementById('preview');
  if(p.imagen_url){
    prev.src = p.imagen_url;
    prev.style.display = 'block';
  }else{
    prev.style.display = 'none';
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

async function deleteProduct(id, imageUrl){
  if(!confirm('¿Seguro que deseas borrar este producto?')) return;
  const { error } = await sb.from('productos').delete().eq('id', id);
  if(error) return showMsg('listMsg', 'No se pudo borrar: ' + error.message, true);

  if(imageUrl){
    try{
      const marker = '/storage/v1/object/public/productos/';
      const idx = imageUrl.indexOf(marker);
      if(idx !== -1){
        const path = decodeURIComponent(imageUrl.substring(idx + marker.length));
        await sb.storage.from('productos').remove([path]);
      }
    }catch(_){}
  }
  showMsg('listMsg', 'Producto eliminado.');
  await loadProducts();
}

function escapeHtml(v){
  return String(v ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

sb.auth.onAuthStateChange(()=>checkSession());
checkSession();
</script>
</body>
</html>
