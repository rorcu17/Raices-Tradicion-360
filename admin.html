<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administración | Raíces y Tradición 360</title>
<style>
:root{--green:#0e493f;--cream:#f7f1e7;--line:#ded8cd;--muted:#6e746f;--red:#8e2f2f}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:#202925}
header{background:var(--green);color:#fff;padding:18px 5vw;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
header a{color:#fff}
.wrap{max-width:1200px;margin:28px auto;padding:0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 12px 30px #0000000d}
#loginView{max-width:470px;margin:55px auto}
label{display:block;font-weight:700;margin:12px 0}
input,select,textarea{width:100%;padding:12px;border:1px solid #d8d1c7;border-radius:10px;margin-top:6px;font:inherit}
input[readonly]{background:#f4f4f4;font-weight:800;color:var(--green)}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.primary{background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700}
.secondary{background:#fff;color:var(--green);border:1px solid var(--green);border-radius:10px;padding:11px 15px;font-weight:700}
.danger{background:var(--red);color:#fff;border:0;border-radius:9px;padding:9px 12px}
.hidden{display:none!important}
.notice{padding:11px 13px;border-radius:10px;margin:12px 0;background:#edf6f2;color:var(--green);display:none}
.error{background:#fdeaea;color:#8b2020}
.grid{display:grid;grid-template-columns:390px 1fr;gap:22px;align-items:start}
.topbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.products{display:grid;gap:14px}
.product{display:grid;grid-template-columns:110px 1fr auto;gap:15px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px}
.product img{width:110px;height:95px;object-fit:contain;border-radius:10px;background:#fff}
.muted{color:var(--muted);font-size:13px}
.price{font-weight:800;color:var(--green);font-size:18px}
.row-actions{display:flex;gap:8px;flex-direction:column}
.preview{margin-top:10px;max-width:100%;max-height:210px;border-radius:12px;display:none}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#f0eadf;font-size:12px;margin-right:5px}
.login-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
@media(max-width:620px){.product{grid-template-columns:85px 1fr}.product img{width:85px;height:78px}.row-actions{grid-column:1/-1;flex-direction:row}}

.orders-card{margin-top:22px}
.orders-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.orders{display:grid;gap:12px}
.order-item{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.order-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.order-code{font-weight:900;color:var(--green);font-size:16px}
.order-date{color:var(--muted);font-size:12px}
.order-main{display:grid;grid-template-columns:1.2fr 1.2fr .6fr 1fr;gap:10px;margin-top:10px}
.order-field{background:#f8f5ef;border-radius:10px;padding:10px}
.order-field b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.order-detail{margin-top:10px;padding:10px;border-radius:10px;background:#f8f5ef;white-space:pre-wrap}
.order-actions{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-top:12px}
.order-actions label{margin:0;min-width:190px}
.order-actions select{margin-top:5px}
.status-pill{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#edf6f2;color:var(--green)}
@media(max-width:800px){.order-main{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.order-main{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div>
    <strong style="font-size:23px">Raíces y Tradición 360</strong><br>
    <small>Panel de administración</small>
  </div>
  <a href="index.html">Ver página</a>
</header>

<div class="wrap">

<section id="loginView" class="card">
  <h2>Acceso de administrador</h2>
  <p class="muted">Ingresa con tu usuario de Supabase.</p>

  <div id="loginMsg" class="notice"></div>
  <div id="recoveryMsg" class="notice"></div>

  <label>Correo
    <input id="email" type="email" value="raul.orocu@gmail.com">
  </label>

  <label>Contraseña
    <input id="password" type="password">
  </label>

  <div class="login-actions">
    <button id="loginBtn" class="primary" type="button">Entrar</button>
    <button id="forgotBtn" class="secondary" type="button">¿Olvidaste tu contraseña?</button>
  </div>
</section>

<section id="adminView" class="hidden">
  <div class="topbar">
    <div>
      <h2 style="margin-bottom:5px">Administrar catálogo</h2>
      <div id="userEmail" class="muted"></div>
    </div>
    <div>
      <button id="newBtn" class="primary" type="button">+ Nuevo producto</button>
      <button id="logoutBtn" class="secondary" type="button">Cerrar sesión</button>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <form id="productForm">
        <h3 id="formTitle">Nuevo producto</h3>
        <div id="formMsg" class="notice"></div>

        <input id="productId" type="hidden">
        <input id="oldImageUrl" type="hidden">

        <label>Código
          <input id="codigo" placeholder="Se genera automáticamente" readonly>
        </label>

        <label>Nombre
          <input id="nombre" placeholder="Nombre del producto">
        </label>

        <label>Categoría
          <select id="categoria">
            <option>Accesorios</option>
            <option>Textiles</option>
            <option>Chaquiras</option>
            <option>Naguas</option>
            <option>Camisas</option>
            <option>Otros</option>
          </select>
        </label>

        <label>Descripción
          <textarea id="descripcion" rows="4"></textarea>
        </label>

        <label>Precio (B/.)
          <input id="precio" type="number" min="0" step="0.01">
        </label>

        <label>Disponibilidad
          <select id="disponibilidad">
            <option>Disponible</option>
            <option>Disponible / personalizable</option>
            <option>Producción limitada</option>
            <option>Bajo pedido</option>
            <option>Por talla y encargo</option>
            <option>Agotado</option>
          </select>
        </label>

        <label>Foto
          <input id="foto" type="file" accept="image/*">
        </label>

        <img id="preview" class="preview">

        <label style="display:flex;align-items:center;gap:8px">
          <input id="activo" type="checkbox" checked style="width:auto;margin:0">
          Mostrar en catálogo
        </label>

        <div class="login-actions">
          <button id="saveBtn" class="primary" type="submit">Guardar producto</button>
          <button id="clearBtn" class="secondary" type="button">Limpiar</button>
        </div>

        <div id="formMsgBottom" class="notice"></div>
      </form>
    </div>

    <div class="card">
      <div class="topbar">
        <h3 style="margin:0">Productos</h3>
        <button id="refreshBtn" class="secondary" type="button">Actualizar</button>
      </div>

      <div id="listMsg" class="notice"></div>
      <div id="productList" class="products"></div>
    </div>
  </div>

  <div class="card orders-card" id="pedidos">
    <div class="orders-toolbar">
      <div>
        <h3 style="margin:0 0 5px">Pedidos recibidos</h3>
        <div class="muted">Pedidos enviados desde la página pública.</div>
      </div>
      <button id="refreshOrdersBtn" class="secondary" type="button">Actualizar pedidos</button>
    </div>

    <div id="ordersMsg" class="notice"></div>
    <div id="orderList" class="orders">
      <p class="muted">Inicia sesión para ver los pedidos.</p>
    </div>
  </div>
</section>

</div>

<script>
const SUPABASE_URL='https://gjmiiqdadsslgjszgswe.supabase.co';
const API_KEY='sb_publishable_LQFknnAXuHgVpv9rcHVw6Q_sYc6SdPR';
const RESET_URL='https://rorcu17.github.io/Raices-Tradicion-360/reset-password.html';

let accessToken=localStorage.getItem('rt360_access_token')||'';
let currentEmail=localStorage.getItem('rt360_email')||'';

const $=id=>document.getElementById(id);

function show(id,text,error=false){
  const el=$(id);
  if(el){
    el.textContent=text;
    el.className='notice'+(error?' error':'');
    el.style.display='block';
  }
}

function hide(id){
  const el=$(id);
  if(el) el.style.display='none';
}

function esc(v){
  return String(v??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function authHeaders(extra={}){
  return {
    'apikey':API_KEY,
    'Authorization':'Bearer '+accessToken,
    ...extra
  };
}

function showAdmin(){
  $('loginView').classList.add('hidden');
  $('adminView').classList.remove('hidden');
  $('userEmail').textContent='Sesión: '+currentEmail;

  loadProducts();
  loadOrders();

  if(!$('productId').value){
    generateCode();
  }
}

function showLogin(){
  $('adminView').classList.add('hidden');
  $('loginView').classList.remove('hidden');
}

async function validateSavedSession(){
  if(!accessToken||!currentEmail){
    showLogin();
    return;
  }

  try{
    const r=await fetch(SUPABASE_URL+'/auth/v1/user',{
      headers:authHeaders()
    });

    if(!r.ok) throw new Error();

    showAdmin();

  }catch{
    logout(false);
  }
}

async function login(){
  hide('loginMsg');

  const email=$('email').value.trim();
  const password=$('password').value;

  if(!email||!password){
    show('loginMsg','Escribe correo y contraseña.',true);
    return;
  }

  show('loginMsg','Verificando acceso...');

  try{
    const r=await fetch(
      SUPABASE_URL+'/auth/v1/token?grant_type=password',
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'apikey':API_KEY
        },
        body:JSON.stringify({email,password})
      }
    );

    const data=await r.json();

    if(!r.ok){
      show(
        'loginMsg',
        'No se pudo iniciar sesión: '+(data.msg||data.message||'credenciales incorrectas'),
        true
      );
      return;
    }

    accessToken=data.access_token;
    currentEmail=(data.user&&data.user.email)||email;

    localStorage.setItem('rt360_access_token',accessToken);
    localStorage.setItem('rt360_email',currentEmail);

    showAdmin();

  }catch(err){
    show('loginMsg','Error de conexión: '+err.message,true);
  }
}

async function recover(){
  hide('recoveryMsg');

  const email=$('email').value.trim();

  if(!email){
    show('recoveryMsg','Escribe primero tu correo.',true);
    return;
  }

  try{
    const url=
      SUPABASE_URL+
      '/auth/v1/recover?redirect_to='+
      encodeURIComponent(RESET_URL);

    const r=await fetch(url,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey':API_KEY
      },
      body:JSON.stringify({email})
    });

    if(!r.ok){
      show('recoveryMsg','No se pudo enviar el correo.',true);
      return;
    }

    show('recoveryMsg','Correo de recuperación enviado.');

  }catch(err){
    show('recoveryMsg','Error: '+err.message,true);
  }
}

function logout(){
  accessToken='';
  currentEmail='';

  localStorage.removeItem('rt360_access_token');
  localStorage.removeItem('rt360_email');

  showLogin();
}

const CODE_PREFIXES={
  'Chaquiras':'CHQ',
  'Textiles':'TEX',
  'Accesorios':'ACC',
  'Naguas':'NAG',
  'Camisas':'CAM',
  'Otros':'OTR'
};

async function generateCode(){

  if($('productId').value){
    return $('codigo').value;
  }

  const categoria=$('categoria').value||'Otros';
  const prefix=CODE_PREFIXES[categoria]||'OTR';
  const base='R360-'+prefix+'-';

  $('codigo').value='Generando...';

  try{
    const r=await fetch(
      SUPABASE_URL+'/rest/v1/productos?select=codigo',
      {headers:authHeaders()}
    );

    const data=await r.json();

    let maxNum=0;

    for(const item of data){
      const code=String(item.codigo||'');

      if(code.startsWith(base)){
        const n=parseInt(code.substring(base.length),10);

        if(Number.isFinite(n)&&n>maxNum){
          maxNum=n;
        }
      }
    }

    const next=String(maxNum+1).padStart(3,'0');

    $('codigo').value=base+next;

  }catch{
    $('codigo').value='';
  }
}

async function clearForm(){

  $('productId').value='';
  $('oldImageUrl').value='';
  $('codigo').value='';
  $('nombre').value='';
  $('categoria').value='Accesorios';
  $('descripcion').value='';
  $('precio').value='';
  $('disponibilidad').value='Disponible';
  $('foto').value='';
  $('activo').checked=true;
  $('preview').src='';
  $('preview').style.display='none';
  $('formTitle').textContent='Nuevo producto';

  await generateCode();
}

$('categoria').addEventListener('change',()=>{
  if(!$('productId').value){
    generateCode();
  }
});

$('foto').addEventListener('change',e=>{
  const file=e.target.files[0];

  if(file){
    $('preview').src=URL.createObjectURL(file);
    $('preview').style.display='block';
  }
});

async function uploadImage(file,code){

  const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
  const safe=code.replace(/[^a-z0-9_-]/gi,'_');
  const path=safe+'_'+Date.now()+'.'+ext;

  const r=await fetch(
    SUPABASE_URL+
    '/storage/v1/object/productos/'+
    encodeURIComponent(path),
    {
      method:'POST',
      headers:authHeaders({
        'Content-Type':file.type||'application/octet-stream'
      }),
      body:file
    }
  );

  if(!r.ok){
    throw new Error('No se pudo subir la foto.');
  }

  return SUPABASE_URL+
    '/storage/v1/object/public/productos/'+
    encodeURIComponent(path);
}

async function saveProduct(event){

  event.preventDefault();

  const id=$('productId').value;
  const nombre=$('nombre').value.trim();

  if(!nombre){
    show('formMsg','Escribe el nombre del producto.',true);
    return;
  }

  if(!$('codigo').value){
    await generateCode();
  }

  let imageUrl=$('oldImageUrl').value||null;
  const file=$('foto').files[0];

  try{

    if(file){
      imageUrl=await uploadImage(file,$('codigo').value);
    }

    const payload={
      codigo:$('codigo').value,
      nombre:nombre,
      categoria:$('categoria').value,
      descripcion:$('descripcion').value.trim(),
      precio:$('precio').value===''?null:Number($('precio').value),
      disponibilidad:$('disponibilidad').value,
      imagen_url:imageUrl,
      activo:$('activo').checked
    };

    const url=id
      ? SUPABASE_URL+'/rest/v1/productos?id=eq.'+id
      : SUPABASE_URL+'/rest/v1/productos';

    const r=await fetch(url,{
      method:id?'PATCH':'POST',
      headers:authHeaders({
        'Content-Type':'application/json',
        'Prefer':'return=minimal'
      }),
      body:JSON.stringify(payload)
    });

    if(!r.ok){
      throw new Error('No se pudo guardar el producto.');
    }

    show('formMsg','Producto guardado correctamente.');

    await clearForm();
    await loadProducts();

  }catch(err){
    show('formMsg','Error: '+err.message,true);
  }
}

async function loadProducts(){

  $('productList').innerHTML='<p class="muted">Cargando...</p>';

  try{

    const r=await fetch(
      SUPABASE_URL+
      '/rest/v1/productos?select=*&order=id.desc',
      {headers:authHeaders()}
    );

    const data=await r.json();

    $('productList').innerHTML='';

    if(!data.length){
      $('productList').innerHTML='<p class="muted">Todavía no hay productos.</p>';
      return;
    }

    data.forEach(p=>{

      const row=document.createElement('article');
      row.className='product';

      const img=p.imagen_url
        ? '<img src="'+esc(p.imagen_url)+'">'
        : '<div>Sin foto</div>';

      row.innerHTML=
        img+
        '<div>'+
        '<div class="muted">'+esc(p.codigo||'')+'</div>'+
        '<h3>'+esc(p.nombre||'')+'</h3>'+
        '<span class="badge">'+esc(p.categoria||'')+'</span>'+
        '<p>'+esc(p.descripcion||'')+'</p>'+
        '<div class="price">'+
        (p.precio==null?'Sin precio':'B/. '+Number(p.precio).toFixed(2))+
        '</div>'+
        '</div>'+
        '<div class="row-actions">'+
        '<button class="secondary editBtn">Editar</button>'+
        '<button class="danger deleteBtn">Borrar</button>'+
        '</div>';

      row.querySelector('.editBtn').onclick=()=>editProduct(p);
      row.querySelector('.deleteBtn').onclick=()=>deleteProduct(p);

      $('productList').appendChild(row);
    });

  }catch(err){

    show('listMsg','Error al cargar productos.',true);

  }
}

function editProduct(p){

  $('productId').value=p.id;
  $('oldImageUrl').value=p.imagen_url||'';
  $('codigo').value=p.codigo||'';
  $('nombre').value=p.nombre||'';
  $('categoria').value=p.categoria||'Otros';
  $('descripcion').value=p.descripcion||'';
  $('precio').value=p.precio??'';
  $('disponibilidad').value=p.disponibilidad||'Disponible';
  $('activo').checked=p.activo!==false;

  $('formTitle').textContent='Editar producto';

  if(p.imagen_url){
    $('preview').src=p.imagen_url;
    $('preview').style.display='block';
  }

  window.scrollTo({top:0,behavior:'smooth'});
}

async function deleteProduct(p){

  if(!confirm('¿Deseas borrar este producto?')) return;

  try{

    const r=await fetch(
      SUPABASE_URL+
      '/rest/v1/productos?id=eq.'+
      p.id,
      {
        method:'DELETE',
        headers:authHeaders()
      }
    );

    if(!r.ok){
      throw new Error();
    }

    await loadProducts();

  }catch{
    show('listMsg','No se pudo borrar el producto.',true);
  }
}

function formatOrderCode(id){
  return 'RT360-'+String(id||'').padStart(5,'0');
}

function formatOrderDate(value){

  if(!value) return '';

  const d=new Date(value);

  return d.toLocaleString('es-PA',{
    year:'numeric',
    month:'2-digit',
    day:'2-digit',
    hour:'2-digit',
    minute:'2-digit'
  });
}

const ORDER_STATES=[
  'Recibido',
  'En proceso',
  'Terminado',
  'Entregado'
];

async function loadOrders(){

  const list=$('orderList');

  list.innerHTML='<p class="muted">Cargando pedidos...</p>';

  try{

    const r=await fetch(
      SUPABASE_URL+
      '/rest/v1/pedidos?select=*&order=created_at.desc',
      {
        headers:authHeaders()
      }
    );

    const data=await r.json();

    if(!r.ok){
      throw new Error();
    }

    list.innerHTML='';

    if(!data.length){

      list.innerHTML=
        '<p class="muted">Todavía no hay pedidos registrados.</p>';

      return;
    }

    data.forEach(o=>{

      const item=document.createElement('article');

      item.className='order-item';

      const options=ORDER_STATES.map(state=>
        '<option value="'+state+'"'+
        (state===(o.estado||'Recibido')?' selected':'')+
        '>'+
        state+
        '</option>'
      ).join('');

      item.innerHTML=
        '<div class="order-head">'+
          '<div>'+
            '<div class="order-code">'+
              esc(formatOrderCode(o.id))+
            '</div>'+
            '<div class="order-date">'+
              esc(formatOrderDate(o.created_at))+
            '</div>'+
          '</div>'+
          '<span class="status-pill">'+
            esc(o.estado||'Recibido')+
          '</span>'+
        '</div>'+

        '<div class="order-main">'+

          '<div class="order-field">'+
            '<b>Cliente</b>'+
            esc(o.cliente||'')+
          '</div>'+

          '<div class="order-field">'+
            '<b>Producto</b>'+
            esc(o.producto||'')+
          '</div>'+

          '<div class="order-field">'+
            '<b>Cantidad</b>'+
            esc(o.cantidad||1)+
          '</div>'+

          '<div class="order-field">'+
            '<b>Estado</b>'+
            esc(o.estado||'Recibido')+
          '</div>'+

        '</div>'+

        '<div class="order-detail">'+
          '<b>Detalle / personalización</b><br>'+
          esc(o.detalle||'Sin detalle adicional')+
        '</div>'+

        '<div class="order-actions">'+

          '<label>Nuevo estado'+
            '<select class="orderStatus">'+
            options+
            '</select>'+
          '</label>'+

          '<button class="primary saveStatusBtn">'+
            'Guardar estado'+
          '</button>'+

          '<button class="danger deleteOrderBtn">'+
            'Borrar pedido'+
          '</button>'+

        '</div>';

      const select=item.querySelector('.orderStatus');

      item.querySelector('.saveStatusBtn').onclick=()=>{
        updateOrderStatus(o.id,select.value);
      };

      item.querySelector('.deleteOrderBtn').onclick=()=>{
        deleteOrder(o.id);
      };

      list.appendChild(item);
    });

  }catch{

    list.innerHTML='';

    show(
      'ordersMsg',
      'No se pudieron cargar los pedidos.',
      true
    );
  }
}

async function updateOrderStatus(id,status){

  try{

    const r=await fetch(
      SUPABASE_URL+
      '/rest/v1/pedidos?id=eq.'+
      id,
      {
        method:'PATCH',
        headers:authHeaders({
          'Content-Type':'application/json',
          'Prefer':'return=minimal'
        }),
        body:JSON.stringify({
          estado:status
        })
      }
    );

    if(!r.ok){
      throw new Error();
    }

    show('ordersMsg','Estado actualizado.');

    await loadOrders();

  }catch{

    show(
      'ordersMsg',
      'No se pudo actualizar el estado.',
      true
    );
  }
}

async function deleteOrder(id){

  if(!confirm('¿Deseas borrar este pedido?')){
    return;
  }

  try{

    const r=await fetch(
      SUPABASE_URL+
      '/rest/v1/pedidos?id=eq.'+
      id,
      {
        method:'DELETE',
        headers:authHeaders()
      }
    );

    if(!r.ok){
      throw new Error();
    }

    show('ordersMsg','Pedido eliminado.');

    await loadOrders();

  }catch{

    show(
      'ordersMsg',
      'No se pudo borrar el pedido.',
      true
    );
  }
}
